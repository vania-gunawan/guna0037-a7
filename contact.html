<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <div class="logo">
            <img src="images/BB-logo-color.jpg" alt="Bellis Blossom Logo with Colour">
        </div>
       
        <nav class="nav" aria-label="main navigation">
            <a href="#">Home</a>
            <a href="#">Collections</a>
            <a href="#">Projects</a>
            <a href="#">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="#">Log in</a>
        </nav>     
    </header>

    <main id="main">
        <section class="contact-section">
            <h1>Contact Us</h1>
                <p>If you have any questions please fill the form below!</p>
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="name" autocomplete="name">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>
                
                <fieldset>
                    <legend>Preferred contact method</legend>
                    <input type="radio" id="by-email" name="contact" value="email">
                    <label for="by-email">Email</label>
                    <input type="radio" id="by-phone" name="contact" value="phone">
                    <label for="by-phone">Phone</label>
                </fieldset>
                <button type="submit">Submit</button>
                
                <table>
                    <caption>Store hours</caption>
                    <thead>
                        <tr>
                            <th scope="col">Day</th>
                            <th scope="col">Opens</th>
                            <th scope="col">Closes</th>
                        </tr>
                    </thead>
                        <tbody>
                        <tr>
                            <th scope="row">Monday</th>
                            <td>9:00</td>
                            <td>17:00</td>
                        </tr>
                        <tr>
                        <th scope="row">Tuesday</th>
                            <td>9:00</td>
                            <td>17:00</td>
                        </tr>
                        <tr>
                        <th scope="row">Saturday</th>
                            <td>10:00</td>
                            <td>15:00</td>
                        </tr>
                        <tr>
                            <th scope="row">Sunday</th>
                            <td colspan="2">Closed</td>
                        </tr>
                        </tbody>
                </table>


        </section>
    </main>



</body>
</html>
